services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_demo_password
      MYSQL_DATABASE: food_delivery_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: food_app_password
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - food_delivery_data:/var/lib/mysql
      - ./sql/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/demo_seed.sql:/docker-entrypoint-initdb.d/02-demo-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ufood_app -pfood_app_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: ./app
    environment:
      PORT: 3000
      DATABASE_URL: mysql://food_app:food_app_password@db:3306/food_delivery_db
      DB_SSL: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  food_delivery_data:
